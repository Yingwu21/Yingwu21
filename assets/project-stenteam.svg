<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="218" viewBox="0 0 1200 218" role="img" aria-label="StenTeam — Making everyday operations a little easier. Sheets, Tools, Workflows.">
<title>StenTeam</title>
<desc>Dark green StenTeam banner with the official white three-person castle, three operational categories, and four STHP accent colours.</desc>
<defs>
 <linearGradient id="ground" x1="0" x2="1" y1="0" y2=".8"><stop stop-color="#112820"/><stop offset=".42" stop-color="#091b15"/><stop offset="1" stop-color="#071711"/></linearGradient>
 <radialGradient id="subtleGlow" cx=".27" cy=".2" r=".85"><stop stop-color="#174334" stop-opacity=".27"/><stop offset=".55" stop-color="#12362c" stop-opacity=".08"/><stop offset="1" stop-color="#070f0c" stop-opacity="0"/></radialGradient>
 <linearGradient id="panel" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#183126"/><stop offset="1" stop-color="#10251d"/></linearGradient>
 <linearGradient id="greenIcon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cfdfd4"/><stop offset="1" stop-color="#a3c0ad"/></linearGradient>
 <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="9" flood-color="#000" flood-opacity=".16"/></filter>
</defs>
